[package]
name = "milky-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
plist = "1"
# File-change notifications (FSEvents on macOS) for the live file index.
notify = "8"
# The local event store (DECISIONS 2026-10-15). Bundled: the same SQLite on
# every Mac, nothing extra to link from Swift, and FTS5 available.
rusqlite = { version = "0.40", features = ["bundled"] }

# Finder's display names come from macOS LaunchServices via CoreFoundation.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
